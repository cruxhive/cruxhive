name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        # `uv run` syncs the project (incl. console scripts) into its own
        # venv instead of `uv pip install --system`, which fails on current
        # runner images: their Python is PEP-668 externally-managed and
        # refuses system-wide installs. CRUXHIVE_REQUIRE_BINS makes the CLI
        # smoke tests fail instead of skipping when a cruxhive-* entry point
        # is missing from PATH.
        env:
          CRUXHIVE_REQUIRE_BINS: "1"
        run: uv run --extra dev pytest -q
