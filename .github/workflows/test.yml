name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the package (console scripts on PATH)
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        # CRUXHIVE_REQUIRE_BINS makes the CLI smoke tests fail instead of
        # skipping when a cruxhive-* entry point is missing from PATH.
        env:
          CRUXHIVE_REQUIRE_BINS: "1"
        run: python -m pytest -q
